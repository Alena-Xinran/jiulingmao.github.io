<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>术后跟诊工作台</title>
<link rel="stylesheet" href="postop.css?v=20260818a">
</head>
<body>
<!--
  登录门。这块看板上有家长姓名、手机号、宠物病历——不能裸奔在公网上。
  演示入口保留，但演示用的是假数据，和真账号走两条路。
-->
<section class="gate" id="gate">
  <div class="gate-card">
    <div class="gate-brand">术后跟诊工作台</div>
    <div class="gate-sub">医院端 · 仅限本院医生使用</div>

    <form id="gate-form" autocomplete="off">
      <input class="gate-input" id="gate-user" type="text" placeholder="工号 / 用户名" autocomplete="username">
      <input class="gate-input" id="gate-pass" type="password" placeholder="密码" autocomplete="current-password">
      <div class="gate-err" id="gate-err" hidden></div>
      <button class="gate-btn" id="gate-submit" type="submit">登 录</button>
    </form>

    <button class="gate-demo" id="gate-demo" type="button">给医生演示 · 7 个病例的假数据</button>
    <p class="gate-note">演示数据只存在这台设备的浏览器里，不写服务器，也看不到真实病例。</p>
  </div>
</section>

<div class="app" id="app" hidden>

<header class="topbar">
  <div class="topbar-in">
    <div class="brand">
      <span class="brand-mark"></span>
      <div>
        <div class="brand-title">术后跟诊工作台</div>
        <div class="brand-sub" id="brand-sub">示例宠物医院</div>
      </div>
    </div>
    <div class="topbar-right">
      <span class="demo-tag">演示数据 · 不写服务器</span>
      <button class="btn-ghost" id="btn-calendar">我的日历</button>
      <button class="btn-ghost" id="btn-refresh">刷新</button>
    </div>
  </div>
</header>

<main class="wrap">

  <!-- 分类统计：一眼看出今天要处理几个 -->
  <section class="stats" id="stats"></section>

  <div class="board">

    <!-- 左：病例列表 -->
    <section class="pane pane-list">
      <div class="pane-head">
        <div class="filters" id="filters"></div>
        <input class="search" id="search" type="search" placeholder="搜宠物名 / 家长 / 术式" />
      </div>
      <div class="list" id="list"></div>
      <div class="list-empty" id="list-empty" hidden>这一类今天没有病例</div>
    </section>

    <!-- 右：病例详情 -->
    <section class="pane pane-detail">
      <div class="detail-empty" id="detail-empty">
        <div class="de-title">选择左侧的病例</div>
        <div class="de-sub">默认只显示需要处理的。恢复正常的病例折在「正常」里，不占你的注意力。</div>
      </div>
      <div class="detail" id="detail" hidden></div>
    </section>
  </div>
</main>

<!-- 照片放大 -->
<div class="lightbox" id="lightbox" hidden>
  <img id="lightbox-img" alt="">
</div>

<!-- 医生改判 -->
<div class="mask" id="override-mask" hidden>
  <div class="modal">
    <div class="modal-title">调整分级</div>
    <div class="modal-sub" id="override-sub"></div>
    <div class="lv-picker" id="override-levels"></div>
    <textarea class="modal-input" id="override-note" rows="3" placeholder="改判理由（会记进病例，也用来校准规则）"></textarea>
    <div class="modal-actions">
      <button class="btn-plain" id="override-cancel">取消</button>
      <button class="btn-primary" id="override-save">保存</button>
    </div>
  </div>
</div>

<!-- 回复家长 -->
</div>

<div class="mask" id="reply-mask" hidden>
  <div class="modal">
    <div class="modal-title">回复家长</div>
    <div class="modal-sub" id="reply-sub"></div>
    <div class="reply-question" id="reply-question" hidden></div>
    <div class="quick" id="reply-quick"></div>
    <textarea class="modal-input" id="reply-text" rows="4" placeholder="写给家长的话"></textarea>
    <div class="modal-actions">
      <button class="btn-plain" id="reply-cancel">取消</button>
      <button class="btn-primary" id="reply-save">发送</button>
    </div>
  </div>
</div>

<div class="mask" id="recall-mask" hidden>
  <div class="modal modal-wide">
    <div class="modal-title">通知来院</div>
    <div class="modal-sub" id="recall-sub"></div>

    <div class="field-label">哪天来 <span class="field-hint">灰色是不出诊或已约满</span></div>
    <div id="recall-when"></div>
    <div class="chips" id="recall-slot"></div>

    <div class="field-label">需要带什么 <span class="field-hint">勾选后会写进给家长的消息</span></div>
    <div class="checks" id="recall-bring"></div>

    <div class="field-label">路上注意 <span class="field-hint">家长最容易做错的就是这几件</span></div>
    <div class="checks" id="recall-care"></div>

    <div class="field-label">补充说明</div>
    <textarea class="modal-input" id="recall-note" rows="2"
      placeholder="选填。比如「先别喂早饭，可能要做超声」"></textarea>

    <div class="field-label">家长会收到</div>
    <div class="preview" id="recall-preview"></div>

    <div class="modal-actions">
      <button class="btn-plain" id="recall-cancel">取消</button>
      <button class="btn-primary" id="recall-save">发送通知</button>
    </div>
  </div>
</div>

<div class="mask" id="cal-mask" hidden>
  <div class="modal modal-wide">
    <div class="modal-title">我的日历</div>
    <div class="modal-sub">未来两周出诊安排。术后复查是插在正常门诊里的，这里看的是每个半天还收不收得下。</div>
    <div class="chips" id="cal-doctors"></div>
    <div id="cal-body"></div>
    <div class="modal-actions">
      <button class="btn-primary" id="cal-close">关闭</button>
    </div>
  </div>
</div>

<div class="toast" id="toast" hidden></div>

<script src="shared/rules.js?v=20260818a"></script>
<script src="shared/ai.js?v=20260818a"></script>
<script src="shared/schedule.js?v=20260818a"></script>
<script src="shared/demo-cast.js?v=20260818a"></script>
<script src="demo-data.js?v=20260818a"></script>
<script src="postop.js?v=20260818a"></script>
</body>
</html>
