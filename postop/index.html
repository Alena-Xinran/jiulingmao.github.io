<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>术后跟诊工作台</title>
<link rel="stylesheet" href="postop.css?v=20260817c">
</head>
<body>

<header class="topbar">
  <div class="topbar-in">
    <div class="brand">
      <span class="brand-mark"></span>
      <div>
        <div class="brand-title">术后跟诊工作台</div>
        <div class="brand-sub" id="brand-sub">示例宠物医院</div>
      </div>
    </div>
    <div class="topbar-right">
      <span class="demo-tag">演示数据 · 不写服务器</span>
      <button class="btn-ghost" id="btn-refresh">刷新</button>
    </div>
  </div>
</header>

<main class="wrap">

  <!-- 分类统计：一眼看出今天要处理几个 -->
  <section class="stats" id="stats"></section>

  <div class="board">

    <!-- 左：病例列表 -->
    <section class="pane pane-list">
      <div class="pane-head">
        <div class="filters" id="filters"></div>
        <input class="search" id="search" type="search" placeholder="搜宠物名 / 主人 / 术式" />
      </div>
      <div class="list" id="list"></div>
      <div class="list-empty" id="list-empty" hidden>这一类今天没有病例</div>
    </section>

    <!-- 右：病例详情 -->
    <section class="pane pane-detail">
      <div class="detail-empty" id="detail-empty">
        <div class="de-title">选择左侧的病例</div>
        <div class="de-sub">默认只显示需要处理的。恢复正常的病例折在「正常」里，不占你的注意力。</div>
      </div>
      <div class="detail" id="detail" hidden></div>
    </section>
  </div>
</main>

<!-- 照片放大 -->
<div class="lightbox" id="lightbox" hidden>
  <img id="lightbox-img" alt="">
</div>

<!-- 医生改判 -->
<div class="mask" id="override-mask" hidden>
  <div class="modal">
    <div class="modal-title">调整分级</div>
    <div class="modal-sub" id="override-sub"></div>
    <div class="lv-picker" id="override-levels"></div>
    <textarea class="modal-input" id="override-note" rows="3" placeholder="改判理由（会记进病例，也用来校准规则）"></textarea>
    <div class="modal-actions">
      <button class="btn-plain" id="override-cancel">取消</button>
      <button class="btn-primary" id="override-save">保存</button>
    </div>
  </div>
</div>

<!-- 回复主人 -->
<div class="mask" id="reply-mask" hidden>
  <div class="modal">
    <div class="modal-title">回复主人</div>
    <div class="modal-sub" id="reply-sub"></div>
    <div class="quick" id="reply-quick"></div>
    <textarea class="modal-input" id="reply-text" rows="4" placeholder="写给主人的话"></textarea>
    <div class="modal-actions">
      <button class="btn-plain" id="reply-cancel">取消</button>
      <button class="btn-primary" id="reply-save">发送</button>
    </div>
  </div>
</div>

<div class="toast" id="toast" hidden></div>

<script src="shared/rules.js?v=20260817c"></script>
<script src="shared/ai.js?v=20260817c"></script>
<script src="shared/demo-cast.js?v=20260817c"></script>
<script src="demo-data.js?v=20260817c"></script>
<script src="postop.js?v=20260817c"></script>
</body>
</html>
