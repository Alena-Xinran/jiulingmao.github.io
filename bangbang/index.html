  <main class="bb-main">

        </div>
      </div>

        <div class="bb-rail" data-era="early">
          <div class="bb-spine" aria-hidden="true"></div>

          <article class="bb-node bb-up">
            <button class="bb-card" type="button" data-full="2025-11.png">
              <img src="2025-11.png" alt="邦邦 · 2025年11月" loading="eager">
            </button>
            <div class="bb-dot" aria-hidden="true"></div>
            <time datetime="2025-11">2025.11</time>
          </article>

          <article class="bb-node bb-down">
            <button class="bb-card" type="button" data-full="2026-1.png">
              <img src="2026-1.png" alt="邦邦 · 2026年1月" loading="lazy">
            </button>
            <div class="bb-dot" aria-hidden="true"></div>
            <time datetime="2026-01">2026.01</time>
          </article>

          <article class="bb-node bb-up">
            <button class="bb-card" type="button" data-full="2026-1-27.png">
              <img src="2026-1-27.png" alt="邦邦 · 2026年1月27日" loading="lazy">
            </button>
            <div class="bb-dot" aria-hidden="true"></div>
            <time datetime="2026-01-27">2026.01.27</time>
          </article>

          <article class="bb-node bb-down">
            <button class="bb-card" type="button" data-full="2026-2.png">
              <img src="2026-2.png" alt="邦邦 · 2026年2月" loading="lazy">
            </button>
            <div class="bb-dot" aria-hidden="true"></div>
            <time datetime="2026-02">2026.02</time>
          </article>

          <article class="bb-node bb-up">
            <button class="bb-card" type="button" data-full="2026-2-27.png">
              <img src="2026-2-27.png" alt="邦邦 · 2026年2月27日" loading="lazy">
            </button>
            <div class="bb-dot" aria-hidden="true"></div>
            <time datetime="2026-02-27">2026.02.27</time>
          </article>

          <article class="bb-node bb-down">
            <button class="bb-card" type="button" data-full="2026-3.png">
              <img src="2026-3.png" alt="邦邦 · 2026年3月" loading="lazy">
            </button>
            <div class="bb-dot" aria-hidden="true"></div>
            <time datetime="2026-03">2026.03</time>

      </div>
    </section>

    <section class="bb-era bb-era-late" aria-labelledby="era-late">

          </article>

          <article class="bb-node bb-down">
            <button class="bb-card" type="button" data-full="2026-4-20.png">
              <img src="2026-4-20.png" alt="邦邦 · 2026年4月20日" loading="lazy">
            </button>
            <div class="bb-dot" aria-hidden="true"></div>
            <time datetime="2026-04-20">2026.04.20</time>
          </article>

          <article class="bb-node bb-up">
            <button class="bb-card" type="button" data-full="2026-4-26.png">

  <footer class="site-footer">
    <div class="container footer-bottom" style="display:flex;justify-content:space-between;padding:1.25rem 0;">

  <div id="lightbox" class="lightbox" role="dialog" aria-label="照片预览">
    <button class="lightbox-close" aria-label="关闭">&times;</button>
    <img id="lightbox-img" src="" alt="">
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const lightbox = document.getElementById('lightbox');
      const lightboxImg = document.getElementById('lightbox-img');
      const closeBtn = document.querySelector('.lightbox-close');

      document.querySelectorAll('.bb-card').forEach((btn) => {
        btn.addEventListener('click', () => {
          const img = btn.querySelector('img');
          if (!img) return;
          lightboxImg.src = img.currentSrc || img.src;
          lightboxImg.alt = img.alt;
          lightbox.classList.add('open');
          document.body.style.overflow = 'hidden';
        });
      });

      const closeLightbox = () => {
        lightbox.classList.remove('open');
        lightboxImg.src = '';
        document.body.style.overflow = '';
      };

      closeBtn?.addEventListener('click', closeLightbox);
      lightbox.addEventListener('click', (e) => {
        if (e.target === lightbox) closeLightbox();
      });
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') closeLightbox();
      });
    });
  </script>
</body>
</html>
